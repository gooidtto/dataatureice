name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-image-first-windows
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source and callable data
        run: |
          python -m py_compile phone_search.py data_validator.py
          python data_validator.py data
          python -m pytest -q

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name "数码回收价格秒查工具" phone_search.py

      - name: Include callable data
        shell: pwsh
        run: |
          if (!(Test-Path "data/snapshots/2026-08-31")) { throw "latest callable snapshot missing" }
          Copy-Item -Path "data" -Destination "dist/数码回收价格秒查工具/data" -Recurse -Force

      - name: Smoke-check package contents
        shell: pwsh
        run: |
          if (!(Test-Path "dist/数码回收价格秒查工具/数码回收价格秒查工具.exe")) { throw "EXE missing" }
          $parts = Get-ChildItem "dist/数码回收价格秒查工具/data/snapshots/2026-08-31" -Filter *.csv
          if ($parts.Count -lt 1) { throw "latest snapshot has no CSV shards" }

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/数码回收价格秒查工具/*" -DestinationPath "数码回收价格秒查工具-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 数码回收价格秒查工具-Windows
          path: 数码回收价格秒查工具-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 数码回收价格秒查工具-Windows.zip
          generate_release_notes: true
