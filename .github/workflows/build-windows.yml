name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, release-image-first-windows, data-database-structure]
    tags: ['v*']
permissions: {contents: write}
env: {PYTHONUTF8: '1'}
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12', architecture: 'x64', cache: pip}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Materialize callable data
        run: python -X utf8 tools/materialize_data.py
      - name: Materialize 2026-07 image facts
        run: python -X utf8 tools/materialize_2026_07_safe.py
      - name: Materialize extra 2026-07 image facts
        run: python -X utf8 tools/materialize_2026_07_extra.py
      - name: Materialize reviewed 2026-07 image facts
        run: python -X utf8 tools/materialize_2026_07_reviewed.py
      - name: Materialize reviewed 2026-07 image facts 2
        run: python -X utf8 tools/materialize_2026_07_reviewed2.py
      - name: Materialize reviewed 2026-07 image facts 3
        run: python -X utf8 tools/materialize_2026_07_reviewed3.py
      - name: Materialize reviewed 2026-07 image facts 4
        run: python -X utf8 tools/materialize_2026_07_reviewed4.py
      - name: Materialize reviewed 2026-07 image facts 5
        run: python -X utf8 tools/materialize_2026_07_reviewed5.py
      - name: Materialize reviewed 2026-07 image facts 6
        run: python -X utf8 tools/materialize_2026_07_reviewed6.py
      - name: Materialize reviewed 2026-07 image facts 7
        run: python -X utf8 tools/materialize_2026_07_reviewed7.py
      - name: Materialize reviewed 2026-07 image facts 8
        run: python -X utf8 tools/materialize_2026_07_reviewed8.py
      - name: Materialize reviewed 2026-07 image facts 9
        run: python -X utf8 tools/materialize_2026_07_reviewed9.py
      - name: Merge 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest.py
      - name: Merge extra 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest_extra.py
      - name: Merge third-pass 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest3.py
      - name: Merge fourth-pass 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest4.py
      - name: Merge fifth-pass 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest5.py
      - name: Merge sixth-pass 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest6.py
      - name: Merge seventh-pass 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest7.py
      - name: Merge eighth-pass 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest8.py
      - name: Merge ninth-pass 2026-07 source manifest
        run: python -X utf8 tools/materialize_2026_07_manifest9.py
      - name: Merge final skipped-image manifest
        run: python -X utf8 tools/materialize_2026_07_manifest10.py
      - name: Organize date database
        run: python -X utf8 tools/organize_date_database.py
      - name: Validate source and callable data
        shell: pwsh
        run: |
          python -X utf8 -m py_compile phone_search.py ui_bootstrap.py data_validator.py tools/date_database.py tools/materialize_data.py tools/organize_date_database.py tools/materialize_2026_07.py tools/materialize_2026_07_safe.py tools/materialize_2026_07_extra.py tools/materialize_2026_07_reviewed.py tools/materialize_2026_07_reviewed2.py tools/materialize_2026_07_reviewed3.py tools/materialize_2026_07_reviewed4.py tools/materialize_2026_07_reviewed5.py tools/materialize_2026_07_reviewed6.py tools/materialize_2026_07_reviewed7.py tools/materialize_2026_07_reviewed8.py tools/materialize_2026_07_reviewed9.py tools/materialize_2026_07_manifest.py tools/materialize_2026_07_manifest_extra.py tools/materialize_2026_07_manifest3.py tools/materialize_2026_07_manifest4.py tools/materialize_2026_07_manifest5.py tools/materialize_2026_07_manifest6.py tools/materialize_2026_07_manifest7.py tools/materialize_2026_07_manifest8.py tools/materialize_2026_07_manifest9.py tools/materialize_2026_07_manifest10.py
          python -X utf8 data_validator.py data
          if ($LASTEXITCODE -ne 0) { throw "data validation failed" }
          python -X utf8 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "pytest failed" }
      - name: Persist canonical date database
        if: github.event_name == 'push' && (github.ref == 'refs/heads/release-image-first-windows' || github.ref == 'refs/heads/data-database-structure')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/database
          if (-not (git diff --cached --quiet)) {
            git commit -m "data: persist canonical date database [skip ci]"
            git push origin "HEAD:${env:GITHUB_REF_NAME}"
          }
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --name "数码回收价格秒查工具" ui_bootstrap.py
      - name: Include callable data
        shell: pwsh
        run: |
          if (!(Test-Path "data/snapshots/2026-08-31")) { throw "latest callable snapshot missing" }
          if (Test-Path "data/callable_release_payload.tar.xz") { Remove-Item "data/callable_release_payload.tar.xz" -Force }
          Copy-Item -Path "data" -Destination "dist/数码回收价格秒查工具/data" -Recurse -Force
      - name: Smoke-check package contents
        shell: pwsh
        run: |
          if (!(Test-Path "dist/数码回收价格秒查工具/数码回收价格秒查工具.exe")) { throw "EXE missing" }
          $expected = @{'2026-07-05'=503;'2026-07-10'=1128;'2026-08-25'=15400;'2026-08-31'=14415}
          foreach ($d in $expected.Keys) {
            $dbFile = "dist/数码回收价格秒查工具/data/database/$d/price.csv"
            if (!(Test-Path $dbFile)) { throw "date database missing: $d" }
            $lines = Get-Content $dbFile
            if ($lines.Count -ne ($expected[$d] + 1)) { throw "database row count mismatch: $d expected $($expected[$d]) got $($lines.Count - 1)" }
            $header = $lines[0]
            if ($header -ne 'record_id,data_date,category,subtype,brand,series,model,model_code,alias,condition,price,unit,note,origin,source_image,source_path,verified,confidence,verification') { throw "database schema mismatch: $d" }
          }
          $parts = Get-ChildItem "dist/数码回收价格秒查工具/data/snapshots/2026-08-31" -Filter *.csv
          if ($parts.Count -lt 1) { throw "latest snapshot has no CSV shards" }
          $rootDateFiles = Get-ChildItem "dist/数码回收价格秒查工具/data" -File -Filter "????-??-??.csv"
          if ($rootDateFiles.Count -gt 0) { throw "date csv remains in data root" }
      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path "dist/数码回收价格秒查工具/*" -DestinationPath "数码回收价格秒查工具-Windows.zip" -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with: {name: 数码回收价格秒查工具-Windows, path: 数码回收价格秒查工具-Windows.zip, if-no-files-found: error}
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: {files: 数码回收价格秒查工具-Windows.zip, generate_release_notes: true}
